{% set name = "stone" %}
{% set version = "3.5.4" %}
{% set python_min = "3.11" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/dropbox/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 31ad4a439576314306ba4345d67f93b4713c0b010cbeb0266164d3ac77df82db

build:
  number: 0
  noarch: python
  entry_points:
    - stone=stone.cli:main
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - setuptools-scm >=8,<9
    - python {{ python_min }}
  run:
    - jinja2 >=3.1.6
    - packaging >=26.2
    - ply >=3.4
    - python >={{ python_min }}

test:
  imports:
    - stone
  commands:
    - pip check
    - stone --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://www.dropbox.com/developers
  summary: Stone is an interface description language (IDL) for APIs.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/dropbox/stone
  doc_url: https://github.com/dropbox/stone/tree/main/docs

extra:
  recipe-maintainers:
    - cjmartian
    - BastianZim
